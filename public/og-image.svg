<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Large TV Icon -->
  <rect x="350" y="150" width="500" height="330" rx="10" fill="#1a1a1a" stroke="#00ff00" stroke-width="6"/>

  <!-- Static Effect -->
  <line x1="380" y1="200" x2="820" y2="200" stroke="#00ff00" stroke-width="4" opacity="0.8"/>
  <line x1="380" y1="250" x2="820" y2="250" stroke="#00ff00" stroke-width="4" opacity="0.5"/>
  <line x1="380" y1="300" x2="820" y2="300" stroke="#00ff00" stroke-width="4" opacity="0.8"/>
  <line x1="380" y1="350" x2="820" y2="350" stroke="#00ff00" stroke-width="4" opacity="0.5"/>
  <line x1="380" y1="400" x2="820" y2="400" stroke="#00ff00" stroke-width="4" opacity="0.8"/>
  <line x1="380" y1="450" x2="820" y2="450" stroke="#00ff00" stroke-width="4" opacity="0.5"/>

  <!-- Title -->
  <text x="600" y="100" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" text-anchor="middle">TakeoverTV</text>

  <!-- Subtitle -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="32" fill="#00ff00" text-anchor="middle">Community-Controlled Television</text>

  <!-- Accent Lines -->
  <rect x="200" y="90" width="800" height="3" fill="#ff0000"/>
  <rect x="250" y="555" width="700" height="3" fill="#ff0000"/>
</svg>
