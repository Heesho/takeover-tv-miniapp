<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bgGradient)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222222" stroke-width="1"/>
  </pattern>
  <rect width="600" height="400" fill="url(#grid)" opacity="0.3"/>

  <!-- Main TV -->
  <rect x="150" y="80" width="300" height="200" rx="15" fill="#111111" stroke="#ff00ff" stroke-width="4"/>
  <rect x="170" y="100" width="260" height="160" fill="#000000"/>

  <!-- Static effect lines -->
  <line x1="180" y1="120" x2="420" y2="120" stroke="#00ffff" stroke-width="2" opacity="0.3"/>
  <line x1="180" y1="160" x2="420" y2="160" stroke="#ff00ff" stroke-width="2" opacity="0.3"/>
  <line x1="180" y1="200" x2="420" y2="200" stroke="#00ffff" stroke-width="2" opacity="0.3"/>
  <line x1="180" y1="240" x2="420" y2="240" stroke="#ff00ff" stroke-width="2" opacity="0.3"/>

  <!-- Play symbol -->
  <polygon points="250,150 250,210 330,180" fill="#ff00ff" opacity="0.8"/>

  <!-- Title -->
  <text x="300" y="330" font-family="monospace" font-size="48" font-weight="bold" fill="#ff00ff" text-anchor="middle">TAKEOVER • TV</text>
  <text x="300" y="360" font-family="monospace" font-size="16" fill="#00ffff" text-anchor="middle">COMMUNITY CONTROLLED TELEVISION</text>

  <!-- Corner decorations -->
  <circle cx="50" cy="50" r="5" fill="#ff00ff"/>
  <circle cx="550" cy="50" r="5" fill="#00ffff"/>
  <circle cx="50" cy="350" r="5" fill="#00ffff"/>
  <circle cx="550" cy="350" r="5" fill="#ff00ff"/>
</svg>
