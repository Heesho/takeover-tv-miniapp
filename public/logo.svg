<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" fill="#000000"/>

  <!-- TV Screen -->
  <rect x="30" y="40" width="140" height="100" rx="10" fill="#111111" stroke="#ff00ff" stroke-width="3"/>

  <!-- Static/Noise effect -->
  <rect x="40" y="50" width="120" height="80" fill="#222222"/>

  <!-- Play icon in center -->
  <polygon points="90,70 90,110 120,90" fill="#ff00ff"/>

  <!-- TV Stand -->
  <rect x="85" y="145" width="30" height="15" fill="#333333"/>
  <rect x="70" y="160" width="60" height="5" fill="#ff00ff"/>

  <!-- Retro dots -->
  <circle cx="50" cy="170" r="3" fill="#00ffff"/>
  <circle cx="150" cy="170" r="3" fill="#00ffff"/>

  <!-- Text -->
  <text x="100" y="190" font-family="monospace" font-size="14" fill="#ff00ff" text-anchor="middle">TAKE0VER</text>
</svg>
