<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" fill="#000000"/>

  <!-- TV Screen -->
  <rect x="40" y="50" width="120" height="80" rx="4" fill="#1a1a1a" stroke="#ffffff" stroke-width="3"/>

  <!-- Static/Signal Lines -->
  <line x1="50" y1="70" x2="150" y2="70" stroke="#00ff00" stroke-width="2" opacity="0.8"/>
  <line x1="50" y1="85" x2="150" y2="85" stroke="#00ff00" stroke-width="2" opacity="0.6"/>
  <line x1="50" y1="100" x2="150" y2="100" stroke="#00ff00" stroke-width="2" opacity="0.8"/>
  <line x1="50" y1="115" x2="150" y2="115" stroke="#00ff00" stroke-width="2" opacity="0.6"/>

  <!-- TV Stand -->
  <rect x="90" y="130" width="20" height="15" fill="#ffffff"/>
  <rect x="70" y="145" width="60" height="5" fill="#ffffff"/>

  <!-- Antenna -->
  <line x1="100" y1="50" x2="80" y2="25" stroke="#ffffff" stroke-width="3"/>
  <line x1="100" y1="50" x2="120" y2="25" stroke="#ffffff" stroke-width="3"/>
  <circle cx="80" cy="25" r="4" fill="#ff0000"/>
  <circle cx="120" cy="25" r="4" fill="#ff0000"/>

  <!-- Text -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">TAKEOVER</text>
</svg>
